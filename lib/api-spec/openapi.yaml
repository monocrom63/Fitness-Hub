openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: portal
    description: Fiudia studio operations and member management
  - name: team
    description: Staff roles and invitations
  - name: pulse
    description: Role- and studio-scoped team updates
  - name: member-app
    description: Private member self-service
  - name: modules
    description: Organization feature availability
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /me:
    get:
      operationId: getMe
      tags: [portal]
      summary: Get the signed-in user's Fiudia access profile
      responses:
        "200":
          description: Current user profile and assigned role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          description: Sign-in required
  /onboarding:
    post:
      operationId: completeOnboarding
      tags: [portal]
      summary: Create an organization and its first studio for a new account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OnboardingInput"
      responses:
        "201":
          description: Organization created and initial district-manager access assigned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "400":
          description: Invalid onboarding details
        "401":
          description: Sign-in required
  /studios:
    get:
      operationId: listStudios
      tags: [portal]
      summary: List studios visible to the signed-in staff member
      responses:
        "200":
          description: Accessible studios within the organization
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StudioSummary"
        "401":
          description: Sign-in required
        "403":
          description: Fiudia access has not been assigned
    post:
      operationId: createStudio
      tags: [portal]
      summary: Create a studio in the signed-in district manager's organization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudioInput"
      responses:
        "201":
          description: Studio created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudioSummary"
        "400":
          description: Invalid studio details
        "401":
          description: Sign-in required
        "403":
          description: District manager role required
        "409":
          description: A studio with the same name and city already exists in this organization
  /studios/{id}:
    patch:
      operationId: updateStudio
      tags: [portal]
      summary: Update a studio's name and city
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudioInput"
      responses:
        "200":
          description: Updated studio
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudioSummary"
        "400":
          description: Invalid studio details or ID
        "401":
          description: Sign-in required
        "403":
          description: District manager role required
        "404":
          description: Studio not found in the district manager's organization
        "409":
          description: A studio with the same name and city already exists in this organization
  /dashboard:
    get:
      operationId: getDashboard
      tags: [portal]
      summary: Get metrics and activity tailored to the signed-in user's role
      parameters:
        - name: studioId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Role-specific studio or district overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"
        "400":
          description: Invalid studio filter
        "401":
          description: Sign-in required
        "403":
          description: Fiudia access has not been assigned or the requested studio is inaccessible
  /members:
    get:
      operationId: listMembers
      tags: [portal]
      summary: Search members visible to the signed-in user
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/MemberStatus"
        - name: studioId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Matching members within the user's permitted scope
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Member"
        "401":
          description: Sign-in required
        "403":
          description: Fiudia access has not been assigned
    post:
      operationId: createMember
      tags: [portal]
      summary: Add a member to a studio
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberInput"
      responses:
        "201":
          description: Member created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
        "400":
          description: Invalid member details
        "401":
          description: Sign-in required
        "403":
          description: Insufficient role or studio access
  /members/{id}:
    patch:
      operationId: updateMember
      tags: [portal]
      summary: Update member contact or membership status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberUpdate"
      responses:
        "200":
          description: Updated member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
        "400":
          description: Invalid member details
        "401":
          description: Sign-in required
        "403":
          description: Insufficient role or studio access
        "404":
          description: Member not found
  /courses:
    get:
      operationId: listCourses
      tags: [portal]
      summary: List upcoming courses visible to the signed-in user
      parameters:
        - name: studioId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Upcoming courses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Course"
        "400":
          description: Invalid studio filter
        "401":
          description: Sign-in required
        "403":
          description: Fiudia access has not been assigned or the requested studio is inaccessible
    post:
      operationId: createCourse
      tags: [portal]
      summary: Schedule a course at an accessible studio
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CourseInput"
      responses:
        "201":
          description: Course created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Course"
        "400":
          description: Invalid course details
        "401":
          description: Sign-in required
        "403":
          description: Insufficient role or studio access
        "409":
          description: The room is closed or occupied, or the trainer is absent on the course date
  /courses/import-duplicates:
    post:
      operationId: checkCourseImportDuplicates
      tags: [portal]
      summary: Find matching scheduled courses before a CSV import
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CourseImportDuplicateCheck"
      responses:
        "200":
          description: CSV row numbers that already match an active course or an earlier row
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseImportDuplicateCheckResult"
        "400":
          description: Invalid studio or course identities
        "401":
          description: Sign-in required
        "403":
          description: Insufficient role or studio access
  /courses/{id}:
    patch:
      operationId: updateCourse
      tags: [portal]
      summary: Edit a future scheduled or full course and notify its booked members
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CourseUpdate" }
      responses:
        "200":
          description: Updated course; in-app notices committed and push deliveries queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Course" }
        "400": { description: Invalid course fields or interval }
        "401": { description: Sign-in required }
        "403": { description: Manager access required }
        "404": { description: Course not found in accessible studio }
        "409": { description: "Stale revision, past or cancelled course, trainer absence, room closure, or overlap" }
  /courses/push-history:
    get:
      operationId: listCourseEditPushHistory
      tags: [portal]
      summary: List recent manual-edit push history for accessible courses
      parameters:
        - name: studioId
          in: query
          schema: { type: integer }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 30 }
      responses:
        "200":
          description: Paginated accessible courses with their most recent manual-edit push delivery
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CourseEditPushHistoryEntry" }
        "400": { description: Invalid studio filter or pagination }
        "401": { description: Sign-in required }
        "403": { description: Manager access required or requested studio is inaccessible }
  /courses/{id}/push-deliveries:
    get:
      operationId: getCourseEditPushDeliveries
      tags: [portal]
      summary: Get the manual-edit push delivery history for an accessible course
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Delivery history, newest first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CourseEditPushReport" }
        "401": { description: Sign-in required }
        "403": { description: Manager access required }
        "404": { description: Course not found in accessible studio }
  /courses/{id}/push-deliveries/{deliveryId}/retry:
    post:
      operationId: retryCourseEditPushDelivery
      tags: [portal]
      summary: Queue a safe retry for one terminal failed current-revision push
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
        - name: deliveryId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Updated delivery history after queueing the retry
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CourseEditPushReport" }
        "401": { description: Sign-in required }
        "403": { description: Manager access required }
        "404": { description: Course or delivery not found in accessible studio }
        "409": { description: Delivery is no longer eligible for retry }
  /trainer-absences:
    get:
      operationId: listTrainerAbsences
      tags: [portal]
      summary: List trainer absences and affected courses for accessible studios (managers only)
      parameters:
        - name: studioId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Absences with course and push delivery status
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TrainerAbsence" }
        "400": { description: Invalid studio filter }
        "403": { description: Manager access required or requested studio is inaccessible }
    post:
      operationId: createTrainerAbsence
      tags: [portal]
      summary: Record a trainer's absence and alert managers in Pulse
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TrainerAbsenceInput" }
      responses:
        "201":
          description: Absence recorded with affected courses
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TrainerAbsence" }
        "400": { description: Invalid date or trainer }
        "403": { description: Manager access required }
        "409": { description: Trainer already absent or course already under review }
  /trainer-absences/{id}/courses/{courseId}/candidates:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
      - { name: courseId, in: path, required: true, schema: { type: integer } }
    get:
      operationId: listTrainerReplacementCandidates
      tags: [portal]
      summary: Show same-studio trainers with scheduling and absence conflicts
      responses:
        "200":
          description: Candidates with reasons for conflicts
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TrainerCandidate" }
        "403": { description: Manager access required }
        "404": { description: Affected course not found }
  /trainer-absences/{id}/courses/{courseId}/request:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
      - { name: courseId, in: path, required: true, schema: { type: integer } }
    post:
      operationId: requestTrainerReplacement
      tags: [portal]
      summary: Record a manager's off-app request to an available trainer
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TrainerRequestInput" }
      responses:
        "200":
          description: Request recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TrainerAbsenceCourse" }
        "403": { description: Manager access required }
        "409": { description: Candidate unavailable or course already resolved }
  /trainer-absences/{id}/courses/{courseId}/resolve:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
      - { name: courseId, in: path, required: true, schema: { type: integer } }
    post:
      operationId: resolveTrainerAbsenceCourse
      tags: [portal]
      summary: Confirm a replacement, cancel the class, or record an external trainer
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TrainerDecisionInput" }
      responses:
        "200":
          description: Course resolved and members notified in-app; push queued and attempted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TrainerAbsenceCourse" }
        "403": { description: Manager access required }
        "409": { description: Course or candidate changed or already resolved }
  /trainer-absences/{id}/courses/{courseId}/push/retry:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
      - { name: courseId, in: path, required: true, schema: { type: integer } }
    post:
      operationId: retryTrainerAbsencePush
      tags: [portal]
      summary: Retry pending and failed push deliveries for a resolved course
      responses:
        "200":
          description: Updated course and delivery status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TrainerAbsenceCourse" }
        "403": { description: Manager access required }
        "409": { description: Course not yet resolved }
  /studios/{studioId}/rooms:
    parameters:
      - name: studioId
        in: path
        required: true
        schema: { type: integer }
    get:
      operationId: listStudioRooms
      tags: [portal]
      summary: List manager-visible rooms in a studio
      responses:
        "200":
          description: Room assets
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RoomAsset" }
        "403": { description: Manager access required }
    post:
      operationId: createStudioRoom
      tags: [portal]
      summary: Add a room asset to a studio
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RoomInput" }
      responses:
        "201":
          description: Room created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoomAsset" }
        "400": { description: Invalid room name }
        "403": { description: Manager access required }
        "409": { description: Room already exists }
  /studios/{studioId}/closures:
    parameters:
      - name: studioId
        in: path
        required: true
        schema: { type: integer }
    get:
      operationId: listStudioRoomClosures
      tags: [portal]
      summary: List room closures in a studio
      responses:
        "200":
          description: Closures
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RoomClosure" }
        "403": { description: Manager access required }
    post:
      operationId: createStudioRoomClosure
      tags: [portal]
      summary: Close a room for an inclusive range of local calendar dates
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RoomClosureInput" }
      responses:
        "201":
          description: Closure created, with managers-only Pulse alert
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoomClosure" }
        "400": { description: Invalid date range or closure details }
        "403": { description: Manager access required }
        "404": { description: Room asset not found in this studio }
        "409": { description: Closure overlaps an existing closure for this room }
  /studios/{studioId}/closures/{closureId}:
    parameters:
      - name: studioId
        in: path
        required: true
        schema: { type: integer }
      - name: closureId
        in: path
        required: true
        schema: { type: integer }
    delete:
      operationId: deleteStudioRoomClosure
      tags: [portal]
      summary: Delete a room closure
      responses:
        "204": { description: Closure deleted }
        "403": { description: Manager access required }
        "404": { description: Closure not found }
        "409": { description: Cannot delete a closure with course resolutions or delivery history }
  /studios/{studioId}/closures/{closureId}/courses:
    get:
      operationId: listClosureAffectedCourses
      tags: [portal]
      summary: List non-cancelled courses intersecting a closure
      parameters:
        - name: studioId
          in: path
          required: true
          schema: { type: integer }
        - name: closureId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Affected courses and alternative rooms
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ClosureAffectedCourse" }
        "403": { description: Manager access required }
        "404": { description: Closure not found }
  /studios/{studioId}/closures/{closureId}/resolutions:
    get:
      operationId: listClosureResolutions
      tags: [portal]
      summary: List persisted course resolutions and email delivery outcomes for a closure
      parameters:
        - name: studioId
          in: path
          required: true
          schema: { type: integer }
        - name: closureId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Resolutions and durable per-recipient notification states
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ClosureCourseResolution" }
        "403": { description: Manager access required }
        "404": { description: Closure not found }
  /studios/{studioId}/closures/push-readiness:
    get:
      operationId: getClosurePushReadiness
      tags: [portal]
      summary: Check whether OneSignal can be used before choosing push for a course change
      parameters:
        - name: studioId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Current push readiness for the accessible studio
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClosurePushReadiness" }
        "403": { description: Manager access required }
  /courses/{id}/closure-resolution:
    post:
      operationId: resolveCourseRoomClosure
      tags: [portal]
      summary: Relocate or cancel an affected course and notify booked members
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CourseClosureResolutionInput" }
      responses:
        "200":
          description: Resolution and notification delivery outcomes
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CourseClosureResolution" }
        "400": { description: Invalid resolution request }
        "403": { description: Manager access required }
        "404": { description: Course not found }
        "409": { description: "Unsupported channel, stale closure, or conflict" }
  /closure-resolutions/{resolutionId}/email-deliveries:
    parameters:
      - name: resolutionId
        in: path
        required: true
        schema: { type: integer }
    get:
      operationId: getClosureEmailDeliveries
      tags: [portal]
      summary: Inspect persisted per-member email delivery states
      responses:
        "200":
          description: Current email delivery states
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClosureEmailDeliveryReport" }
        "403": { description: Manager access required }
        "404": { description: Resolution not found }
    post:
      operationId: retryClosureEmailDeliveries
      tags: [portal]
      summary: Retry failed or recover expired in-progress email deliveries
      description: Claims eligible deliveries atomically; uses a stable provider idempotency key and returns per-member states. No request body is required.
      responses:
        "200":
          description: Delivery states after retry attempts
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClosureEmailDeliveryReport" }
        "403": { description: Manager access required }
        "404": { description: Resolution not found }
  /closure-resolutions/{resolutionId}/push-deliveries:
    parameters:
      - name: resolutionId
        in: path
        required: true
        schema: { type: integer }
    get:
      operationId: getClosurePushDeliveries
      tags: [portal]
      summary: Inspect per-device push delivery outcomes
      responses:
        "200":
          description: Current push delivery states
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClosurePushDeliveryReport" }
        "403": { description: Manager access required }
        "404": { description: Resolution not found }
    post:
      operationId: retryClosurePushDeliveries
      tags: [portal]
      summary: Retry pending or failed push deliveries with their original idempotency keys
      responses:
        "200":
          description: Push delivery states after retry attempts
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClosurePushDeliveryReport" }
        "403": { description: Manager access required }
        "404": { description: Resolution not found }
  /courses/{id}/bookings:
    get:
      operationId: listCourseBookings
      tags: [portal]
      summary: List confirmed and waitlisted members for an accessible course
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Course roster
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CourseRosterBooking" }
        "403": { description: Manager access required }
        "404": { description: Course not found }
    post:
      operationId: createStaffCourseBooking
      tags: [portal]
      summary: Book a member into an accessible course or join its waitlist
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StaffBookingInput" }
      responses:
        "201":
          description: Booking or waitlist place created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CourseBooking" }
        "400": { description: Invalid booking }
        "403": { description: Studio access denied }
        "404": { description: Course or member not found }
        "409": { description: Already booked or course unavailable }
  /courses/{id}/bookings/{memberId}:
    delete:
      operationId: cancelStaffCourseBooking
      tags: [portal]
      summary: Cancel a member booking as an authorized studio manager
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
        - name: memberId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BookingCancellationInput" }
      responses:
        "200":
          description: Cancelled booking
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CourseBooking" }
        "403": { description: Manager access required }
        "404": { description: Booking not found }
        "409": { description: Booking status changed since the roster was viewed }
  /members/{id}/invite:
    post:
      operationId: createMemberInvitation
      tags: [portal]
      summary: Generate and email a one-use member onboarding invitation
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "201":
          description: Invitation link, shown only once
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemberInvitationLink" }
        "403": { description: Manager access required }
        "404": { description: Member not found }
        "409": { description: Member is already linked or inactive }
  /members/{id}/invite/resend:
    post:
      operationId: resendMemberInvitation
      tags: [portal]
      summary: Retry a failed member invitation email using the existing link
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Existing invitation link and updated email attempt status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemberInvitationLink" }
        "403": { description: Manager access required }
        "404": { description: Member or active invitation not found }
        "409": { description: Invitation is not eligible for retry }
  /modules:
    get:
      operationId: listModules
      tags: [modules]
      summary: List organization modules for navigation and permissions
      responses:
        "200":
          description: Available modules
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ModuleSetting" }
  /modules/{key}:
    patch:
      operationId: updateModule
      tags: [modules]
      summary: Enable or disable an organization module as district manager
      parameters:
        - name: key
          in: path
          required: true
          schema: { $ref: "#/components/schemas/ModuleKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ModuleUpdate" }
      responses:
        "200":
          description: Updated module
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModuleSetting" }
        "403": { description: District manager required }
  /member/me:
    get:
      operationId: getMemberHome
      tags: [member-app]
      summary: Get the signed-in member's own profile and activity summary
      responses:
        "200":
          description: Member profile, or null until linked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemberHome" }
        "401": { description: Sign-in required }
  /member/me/profile:
    patch:
      operationId: updateOwnMemberProfile
      tags: [member-app]
      summary: Update editable fields of the signed-in member's linked membership
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MemberSelfUpdate" }
      responses:
        "200":
          description: Updated member home
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemberHome" }
        "400": { description: Invalid profile data }
        "401": { description: Sign-in required }
        "403": { description: Membership not linked }
  /member/me/billing:
    get:
      operationId: getMemberBilling
      tags: [member-app]
      summary: Get the signed-in member's SEPA subscription status
      responses:
        "200":
          description: Saved payment interval and subscription state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemberBilling" }
        "401": { description: Sign-in required }
        "403": { description: Membership not linked }
    post:
      operationId: createMemberBillingCheckout
      tags: [member-app]
      summary: Start a hosted Stripe SEPA mandate and subscription checkout
      responses:
        "200":
          description: Stripe Checkout URL
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemberBillingCheckout" }
        "401": { description: Sign-in required }
        "403": { description: Active linked membership required }
        "409": { description: Subscription already started or tariff has no configured price }
  /member/notification-settings:
    patch:
      operationId: updateMemberNotificationSettings
      tags: [member-app]
      summary: Opt in or out of waitlist promotion email (delivery not active yet)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MemberNotificationSettings" }
      responses:
        "200":
          description: Updated member home with saved preference
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemberHome" }
        "400": { description: Invalid preference }
        "401": { description: Sign-in required }
        "403": { description: Membership not linked or courses unavailable }
  /member/push-subscriptions:
    post:
      operationId: registerMemberPushSubscription
      tags: [member-app]
      summary: Bind this browser's OneSignal push subscription to the signed-in member
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PushSubscriptionInput" }
      responses:
        "200":
          description: Push subscription linked to this member
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PushSubscriptionRegistration" }
        "401": { description: Sign-in required }
        "403": { description: Linked active membership required }
        "409": { description: Subscription is already linked to another member }
  /member/push-subscriptions/{subscriptionId}:
    delete:
      operationId: unregisterMemberPushSubscription
      tags: [member-app]
      summary: Stop targeting this member's browser subscription
      parameters:
        - name: subscriptionId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Subscription unlinked from this member
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PushSubscriptionRegistration" }
        "401": { description: Sign-in required }
        "403": { description: Linked membership required }
  /member/claim:
    post:
      operationId: claimMembership
      tags: [member-app]
      summary: Link a membership to a signed-in, verified matching email account
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MemberLinkInput" }
      responses:
        "200":
          description: Linked membership
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemberHome" }
        "403": { description: Email not verified or does not match }
        "404": { description: Membership not found }
        "409": { description: Membership already linked }
  /member/invitations/accept:
    post:
      operationId: acceptMemberInvitation
      tags: [member-app]
      summary: Link a membership using a one-use invitation and verified email
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MemberInvitationAcceptInput" }
      responses:
        "200":
          description: Linked member home
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemberHome" }
        "403": { description: Email unverified or mismatch }
        "404": { description: "Invitation expired, invalid or used" }
        "409": { description: Already linked or inactive }
  /member/notifications:
    get:
      operationId: listMemberNotifications
      tags: [member-app]
      summary: Recent waitlist promotion notifications for the signed-in member
      description: Returns the latest 50 notifications by default. Pass the id of the last notification from the previous response as beforeId to fetch the next page. The cursor must belong to the signed-in member.
      parameters:
        - name: beforeId
          in: query
          required: false
          description: Positive id of an earlier notification owned by the signed-in member; results continue before that notification.
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Own notifications
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MemberNotification" }
  /member/notifications/unread-count:
    get:
      operationId: getMemberNotificationUnreadCount
      tags: [member-app]
      summary: Count unread notifications belonging to the signed-in member
      responses:
        "200":
          description: Own unread notification count across the entire history
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemberNotificationUnreadCount" }
  /member/notifications/{id}/read:
    patch:
      operationId: markMemberNotificationRead
      tags: [member-app]
      summary: Mark an own notification as read
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Updated notification
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemberNotification" }
        "404": { description: Notification not found }
  /member/courses:
    get:
      operationId: listMemberCourses
      tags: [member-app]
      summary: Upcoming courses and own booking states, optionally including a course linked from an own notification
      parameters:
        - name: courseId
          in: query
          description: Include a past course only when the signed-in member has a notification for it
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Accessible upcoming courses and, when requested, the course from an own notification
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MemberCourse" }
  /member/courses/{id}:
    get:
      operationId: getMemberCourse
      tags: [member-app]
      summary: Get a course in the member's studio, including historical courses linked from an own notification
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1, maximum: 2147483647 }
      responses:
        "200":
          description: Course details and own booking state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemberCourseDetail" }
        "400": { description: Invalid course identifier }
        "401": { description: Sign-in required }
        "403": { description: Linked membership required }
        "404": { description: Course unavailable or not accessible }
  /member/courses/{id}/book:
    post:
      operationId: bookMemberCourse
      tags: [member-app]
      summary: Book the signed-in member or join the waitlist
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "201":
          description: Booking or waitlist place
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CourseBooking" }
        "403": { description: Module unavailable or membership inactive }
        "404": { description: Course not found }
        "409": { description: Already booked or course unavailable }
    delete:
      operationId: cancelMemberCourse
      tags: [member-app]
      summary: Cancel an own booking and promote the next waitlisted member
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Booking cancelled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CourseBooking" }
        "404": { description: Active booking not found }
  /member/check-ins:
    get:
      operationId: listMemberCheckIns
      tags: [member-app]
      summary: Recent check-ins for the signed-in member only
      responses:
        "200":
          description: Own check-ins
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MemberCheckIn" }
  /check-ins:
    post:
      operationId: createCheckIn
      tags: [portal]
      summary: Record a member check-in at an accessible studio
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckInInput"
      responses:
        "201":
          description: Check-in recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckIn"
        "400":
          description: Invalid check-in details
        "401":
          description: Sign-in required
        "403":
          description: Insufficient role or studio access
  /pulse:
    get:
      operationId: listPulse
      tags: [pulse]
      summary: List Pulse messages visible to the signed-in staff member
      parameters:
        - name: retractedOnly
          in: query
          description: Manager-only archive of withdrawn messages within the same visibility boundaries; never includes active messages.
          schema: { type: boolean }
        - name: beforeId
          in: query
          description: Load messages older than this message ID
          schema: { type: integer, minimum: 1 }
        - name: unreadOnly
          in: query
          description: Show only messages not yet read by the signed-in staff member
          schema: { type: boolean }
        - name: search
          in: query
          description: Case-insensitive literal substring search in the current title or body, including older messages. Leading and trailing whitespace is trimmed; whitespace-only searches are invalid. SQL wildcard characters are treated literally. Search combines with beforeId and unreadOnly and never expands organization, studio, audience, or retraction visibility.
          schema: { type: string, minLength: 1, maxLength: 120 }
      responses:
        "200":
          description: Up to 30 visible messages matching the filters, with read state, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PulseMessage"
        "400":
          description: Invalid filter or message cursor
        "401":
          description: Sign-in required
        "403":
          description: Fiudia access has not been assigned
    post:
      operationId: createPulseMessage
      tags: [pulse]
      summary: Publish a role- and studio-scoped Pulse message
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PulseInput"
      responses:
        "201":
          description: Pulse message created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PulseMessage"
        "400":
          description: Invalid message details
        "401":
          description: Sign-in required
        "403":
          description: Insufficient role or studio access
  /pulse/{id}:
    patch:
      operationId: updatePulseMessage
      tags: [pulse]
      summary: Correct a published Pulse message as its manager-author or a district manager
      description: Title, body and priority can change when the submitted revision matches the current message; audience and studio remain fixed. Prior read receipts are reset only for successful corrections.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PulseCorrection"
      responses:
        "200":
          description: Updated message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PulseMessage"
        "400": { description: Invalid correction }
        "401": { description: Sign-in required }
        "403": { description: Insufficient permission }
        "404": { description: Message not found or already retracted }
        "409": { description: Message has been corrected since it was loaded }
    delete:
      operationId: retractPulseMessage
      tags: [pulse]
      summary: Retract a message as its manager-author or a district manager without deleting its audit record
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204": { description: Message retracted }
        "401": { description: Sign-in required }
        "403": { description: Insufficient permission }
        "404": { description: Message not found or already retracted }
  /pulse/{id}/read:
    post:
      operationId: markPulseRead
      tags: [pulse]
      summary: Record that the signed-in staff member read the displayed Pulse revision
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PulseReadInput"
      responses:
        "200":
          description: Read receipt recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PulseRead"
        "409":
          description: The message has changed since the displayed revision
        "401":
          description: Sign-in required
        "403":
          description: Message is not visible to this staff member
        "404":
          description: Message not found
  /pulse/{id}/history:
    get:
      operationId: listPulseHistory
      tags: [pulse]
      summary: Manager-only correction and retraction history within the caller's message visibility
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Revisions from oldest to newest, including full previous content and changed fields
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PulseHistoryEntry" }
        "400": { description: Invalid message ID }
        "401": { description: Sign-in required }
        "403": { description: Manager access required }
        "404": { description: Message not visible }
  /team/invitations:
    get:
      operationId: listInvitations
      tags: [team]
      summary: List invitations available to the signed-in manager
      responses:
        "200":
          description: Pending and recently accepted invitations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Invitation"
        "401":
          description: Sign-in required
        "403":
          description: Insufficient role
    post:
      operationId: createInvitation
      tags: [team]
      summary: Invite a colleague with a manager-assigned role
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvitationInput"
      responses:
        "201":
          description: Invitation created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invitation"
        "400":
          description: Invalid invitation details
        "401":
          description: Sign-in required
        "403":
          description: Insufficient role or studio access
  /team/invitations/{token}/accept:
    post:
      operationId: acceptInvitation
      tags: [team]
      summary: Accept a role invitation for the signed-in account
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Invitation accepted and role assigned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          description: Sign-in required
        "403":
          description: Invitation does not match the signed-in account
        "404":
          description: Invitation not found or expired
  /v1/contracts/settings:
    get:
      operationId: getContractSettings
      tags: [portal]
      summary: Get organization contract settings
      responses:
        "200":
          description: Contract settings and membership plans
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContractSettings" }
        "401": { description: Sign-in required }
        "403": { description: Manager access required }
    put:
      operationId: updateContractSettings
      tags: [portal]
      summary: Update organization contract settings and membership plans
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ContractSettingsInput" }
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContractSettings" }
        "400": { description: Invalid contract settings }
        "401": { description: Sign-in required }
        "403": { description: Manager access required }
  /v1/member/contracts/current:
    get:
      operationId: getCurrentMemberContract
      tags: [member-app]
      summary: Get or create the member's current unsigned contract
      responses:
        "200":
          description: Current contract details and PDF preview URL
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemberContract" }
        "401": { description: Sign-in required }
        "403": { description: Linked membership required or contract settings incomplete }
  /v1/contracts/{id}/sig:
    post:
      operationId: signMemberContract
      tags: [member-app]
      summary: Accept terms and sign the member contract
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ContractSignatureInput" }
      responses:
        "200":
          description: Signed contract; PDF was emailed to the member's registered address
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemberContract" }
        "400": { description: Invalid signature or terms acceptance }
        "401": { description: Sign-in required }
        "403": { description: Contract does not belong to this member }
        "404": { description: Contract not found }
        "409": { description: Contract already signed }
  /v1/contracts/{id}/pdf:
    get:
      operationId: getMemberContractPdf
      tags: [member-app]
      summary: Render the immutable contract snapshot as a PDF
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Contract PDF
          content:
            application/pdf:
              schema: { type: string, format: binary }
        "401": { description: Sign-in required }
        "403": { description: Contract access denied }
        "404": { description: Contract not found }
components:
  schemas:
    ContractPlan:
      type: object
      required: [id, name, durationMonths, monthlyPriceCents, semiannualDiscountPercent, annualDiscountPercent, active]
      properties:
        id: { type: integer }
        name: { type: string }
        durationMonths: { type: integer }
        monthlyPriceCents: { type: integer }
        semiannualDiscountPercent: { type: integer }
        annualDiscountPercent: { type: integer }
        active: { type: boolean }
    ContractPlanInput:
      type: object
      required: [name, durationMonths, monthlyPriceCents, semiannualDiscountPercent, annualDiscountPercent]
      properties:
        id: { type: ["integer", "null"] }
        name: { type: string, minLength: 2, maxLength: 80 }
        durationMonths: { type: integer, minimum: 1, maximum: 1200 }
        monthlyPriceCents: { type: integer, minimum: 0 }
        semiannualDiscountPercent: { type: integer, minimum: 0, maximum: 100 }
        annualDiscountPercent: { type: integer, minimum: 0, maximum: 100 }
    ContractSettings:
      type: object
      required: [legalName, legalAddress, contactEmail, contactPhone, termsText, termsVersion, enrollmentFeeCents, membershipCardFeeCents, paymentDueDay, plans]
      properties:
        legalName: { type: string }
        legalAddress: { type: string }
        contactEmail: { type: string }
        contactPhone: { type: string }
        termsText: { type: string }
        termsVersion: { type: integer }
        enrollmentFeeCents: { type: integer }
        membershipCardFeeCents: { type: integer }
        paymentDueDay: { type: integer }
        plans:
          type: array
          items: { $ref: "#/components/schemas/ContractPlan" }
    ContractSettingsInput:
      type: object
      required: [legalName, legalAddress, contactEmail, contactPhone, termsText, enrollmentFeeCents, membershipCardFeeCents, paymentDueDay, plans]
      properties:
        legalName: { type: string, maxLength: 200 }
        legalAddress: { type: string, maxLength: 500 }
        contactEmail: { type: string, format: email }
        contactPhone: { type: string, maxLength: 40 }
        termsText: { type: string, maxLength: 50000 }
        enrollmentFeeCents: { type: integer, minimum: 0 }
        membershipCardFeeCents: { type: integer, minimum: 0 }
        paymentDueDay: { type: integer, minimum: 1, maximum: 28 }
        plans:
          type: array
          items: { $ref: "#/components/schemas/ContractPlanInput" }
    ContractSignatureInput:
      type: object
      required: [signatureName, acceptTerms]
      properties:
        signatureName: { type: string, minLength: 2, maxLength: 160 }
        acceptTerms: { type: boolean, const: true }
    MemberContract:
      type: object
      required: [id, status, contractSnapshot, termsVersion, signatureName, signedAt, emailStatus, pdfUrl]
      properties:
        id: { type: integer }
        status: { type: string, enum: [draft, signed] }
        contractSnapshot: { type: object, additionalProperties: true }
        termsVersion: { type: integer }
        signatureName: { type: ["string", "null"] }
        signedAt: { type: ["string", "null"], format: date-time }
        emailStatus: { type: string, enum: [not_sent, sent, failed] }
        pdfUrl: { type: string }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Role:
      type: string
      enum: [district_manager, studio_manager, studio_employee]
    MemberStatus:
      type: string
      enum: [active, trial, paused]
    BillingInterval:
      type: string
      enum: [monthly, semiannual, annual]
    Me:
      type: object
      required: [userId, userName, email, isOnboarded]
      properties:
        userId: { type: string }
        userName: { type: string }
        email: { type: string, format: email }
        isOnboarded: { type: boolean }
        role: { allOf: [{ $ref: "#/components/schemas/Role" }], nullable: true }
        organizationId: { type: ["integer", "null"] }
        organizationName: { type: ["string", "null"] }
        studioId: { type: ["integer", "null"] }
        studioName: { type: ["string", "null"] }
    OnboardingInput:
      type: object
      required: [organizationName, studioName, city]
      properties:
        organizationName: { type: string, minLength: 2, maxLength: 120 }
        studioName: { type: string, minLength: 2, maxLength: 120 }
        city: { type: string, minLength: 2, maxLength: 120 }
    StudioSummary:
      type: object
      required: [id, name, city]
      properties:
        id: { type: integer }
        name: { type: string }
        city: { type: string }
    StudioInput:
      type: object
      required: [name, city]
      properties:
        name: { type: string, minLength: 2, maxLength: 120 }
        city: { type: string, minLength: 2, maxLength: 120 }
    DashboardMetric:
      type: object
      required: [label, value, delta, tone]
      properties:
        label: { type: string }
        value: { type: string }
        delta: { type: string }
        tone: { type: string, enum: [positive, neutral, warning] }
    DashboardActivity:
      type: object
      required: [id, title, description, happenedAt, category]
      properties:
        id: { type: integer }
        title: { type: string }
        description: { type: string }
        happenedAt: { type: string, format: date-time }
        category: { type: string, enum: [member, course, team, check_in] }
    Dashboard:
      type: object
      required: [role, userName, studioName, metrics, activities, courses]
      properties:
