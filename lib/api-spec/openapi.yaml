        field: { type: string, enum: [title, body, priority] }
        before: { type: string }
        after: { type: string }
    PulseHistoryEntry:
      type: object
      required: [id, action, editorStaffId, editorName, editedAt, previous, changes]
      properties:
        id: { type: integer }
        action: { type: string, enum: [correction, retraction] }
        editorStaffId: { type: integer }
        editorName: { type: string }
        editedAt: { type: string, format: date-time }
