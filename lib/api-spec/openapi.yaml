          type: object
          required: [title, body, priority]
          properties:
            title: { type: string }
            body: { type: string }
            priority: { $ref: "#/components/schemas/PulsePriority" }
        changes:
          type: array
          items: { $ref: "#/components/schemas/PulseHistoryChange" }
    PulseRead:
      type: object
      required: [messageId, readAt]
      properties:
        messageId: { type: integer }
