openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: portal
    description: Fiudia studio operations and member management
  - name: team
    description: Staff roles and invitations
  - name: pulse
    description: Role- and studio-scoped team updates
  - name: member-app
    description: Private member self-service
  - name: modules
    description: Organization feature availability
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /me:
    get:
      operationId: getMe
      tags: [portal]
      summary: Get the signed-in user's Fiudia access profile
      responses:
        "200":
          description: Current user profile and assigned role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          description: Sign-in required
  /onboarding:
    post:
      operationId: completeOnboarding
      tags: [portal]
      summary: Create an organization and its first studio for a new account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OnboardingInput"
      responses:
        "201":
          description: Organization created and initial district-manager access assigned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "400":
          description: Invalid onboarding details
        "401":
          description: Sign-in required
  /studios:
    get:
      operationId: listStudios
      tags: [portal]
      summary: List studios visible to the signed-in staff member
      responses:
        "200":
          description: Accessible studios within the organization
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StudioSummary"
        "401":
          description: Sign-in required
        "403":
          description: Fiudia access has not been assigned
  /dashboard:
    get:
      operationId: getDashboard
      tags: [portal]
      summary: Get metrics and activity tailored to the signed-in user's role
      responses:
        "200":
          description: Role-specific studio or district overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"
        "401":
          description: Sign-in required
        "403":
          description: Fiudia access has not been assigned
  /members:
    get:
      operationId: listMembers
      tags: [portal]
      summary: Search members visible to the signed-in user
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/MemberStatus"
        - name: studioId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Matching members within the user's permitted scope
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Member"
        "401":
          description: Sign-in required
        "403":
          description: Fiudia access has not been assigned
    post:
      operationId: createMember
      tags: [portal]
      summary: Add a member to a studio
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberInput"
      responses:
        "201":
          description: Member created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
        "400":
          description: Invalid member details
        "401":
          description: Sign-in required
        "403":
          description: Insufficient role or studio access
  /members/{id}:
    patch:
      operationId: updateMember
      tags: [portal]
      summary: Update member contact or membership status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberUpdate"
      responses:
        "200":
          description: Updated member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
        "400":
          description: Invalid member details
        "401":
          description: Sign-in required
        "403":
          description: Insufficient role or studio access
        "404":
          description: Member not found
  /courses:
    get:
      operationId: listCourses
      tags: [portal]
      summary: List upcoming courses visible to the signed-in user
      responses:
        "200":
          description: Upcoming courses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Course"
        "401":
          description: Sign-in required
        "403":
          description: Fiudia access has not been assigned
    post:
      operationId: createCourse
      tags: [portal]
      summary: Schedule a course at an accessible studio
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CourseInput"
      responses:
        "201":
          description: Course created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Course"
        "400":
          description: Invalid course details
        "401":
          description: Sign-in required
        "403":
          description: Insufficient role or studio access
  /courses/{id}/bookings:
    get:
      operationId: listCourseBookings
      tags: [portal]
      summary: List confirmed and waitlisted members for an accessible course
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Course roster
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CourseRosterBooking" }
        "403": { description: Manager access required }
        "404": { description: Course not found }
    post:
      operationId: createStaffCourseBooking
      tags: [portal]
      summary: Book a member into an accessible course or join its waitlist
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StaffBookingInput" }
      responses:
        "201":
          description: Booking or waitlist place created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CourseBooking" }
        "400": { description: Invalid booking }
        "403": { description: Studio access denied }
        "404": { description: Course or member not found }
        "409": { description: Already booked or course unavailable }
  /courses/{id}/bookings/{memberId}:
    delete:
      operationId: cancelStaffCourseBooking
      tags: [portal]
      summary: Cancel a member booking as an authorized studio manager
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
        - name: memberId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BookingCancellationInput" }
      responses:
        "200":
          description: Cancelled booking
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CourseBooking" }
        "403": { description: Manager access required }
        "404": { description: Booking not found }
        "409": { description: Booking status changed since the roster was viewed }
  /members/{id}/invite:
    post:
      operationId: createMemberInvitation
      tags: [portal]
      summary: Generate a one-use member onboarding link
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "201":
          description: Invitation link, shown only once
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemberInvitationLink" }
        "403": { description: Manager access required }
        "404": { description: Member not found }
        "409": { description: Member is already linked or inactive }
  /modules:
    get:
      operationId: listModules
      tags: [modules]
      summary: List organization modules for navigation and permissions
      responses:
        "200":
          description: Available modules
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ModuleSetting" }
  /modules/{key}:
    patch:
      operationId: updateModule
      tags: [modules]
      summary: Enable or disable an organization module as district manager
      parameters:
        - name: key
          in: path
          required: true
          schema: { $ref: "#/components/schemas/ModuleKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ModuleUpdate" }
      responses:
        "200":
          description: Updated module
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModuleSetting" }
        "403": { description: District manager required }
  /member/me:
    get:
      operationId: getMemberHome
      tags: [member-app]
      summary: Get the signed-in member's own profile and activity summary
      responses:
        "200":
          description: Member profile, or null until linked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemberHome" }
        "401": { description: Sign-in required }
  /member/claim:
    post:
      operationId: claimMembership
      tags: [member-app]
      summary: Link a membership to a signed-in, verified matching email account
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MemberLinkInput" }
      responses:
        "200":
          description: Linked membership
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemberHome" }
        "403": { description: Email not verified or does not match }
        "404": { description: Membership not found }
        "409": { description: Membership already linked }
  /member/invitations/accept:
    post:
      operationId: acceptMemberInvitation
      tags: [member-app]
      summary: Link a membership using a one-use invitation and verified email
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MemberInvitationAcceptInput" }
      responses:
        "200":
          description: Linked member home
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemberHome" }
        "403": { description: Email unverified or mismatch }
        "404": { description: "Invitation expired, invalid or used" }
        "409": { description: Already linked or inactive }
  /member/notifications:
    get:
      operationId: listMemberNotifications
      tags: [member-app]
      summary: Recent waitlist promotion notifications for the signed-in member
      responses:
        "200":
          description: Own notifications
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MemberNotification" }
  /member/notifications/{id}/read:
    patch:
      operationId: markMemberNotificationRead
      tags: [member-app]
      summary: Mark an own notification as read
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Updated notification
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemberNotification" }
        "404": { description: Notification not found }
  /member/courses:
    get:
      operationId: listMemberCourses
      tags: [member-app]
      summary: Upcoming courses and own booking states at the member's studio
      responses:
        "200":
          description: Accessible upcoming courses
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MemberCourse" }
  /member/courses/{id}/book:
    post:
      operationId: bookMemberCourse
      tags: [member-app]
      summary: Book the signed-in member or join the waitlist
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "201":
          description: Booking or waitlist place
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CourseBooking" }
        "403": { description: Module unavailable or membership inactive }
        "404": { description: Course not found }
        "409": { description: Already booked or course unavailable }
    delete:
      operationId: cancelMemberCourse
      tags: [member-app]
      summary: Cancel an own booking and promote the next waitlisted member
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Booking cancelled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CourseBooking" }
        "404": { description: Active booking not found }
  /member/check-ins:
    get:
      operationId: listMemberCheckIns
      tags: [member-app]
      summary: Recent check-ins for the signed-in member only
      responses:
        "200":
          description: Own check-ins
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MemberCheckIn" }
  /check-ins:
    post:
      operationId: createCheckIn
      tags: [portal]
      summary: Record a member check-in at an accessible studio
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckInInput"
      responses:
        "201":
          description: Check-in recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckIn"
        "400":
          description: Invalid check-in details
        "401":
          description: Sign-in required
        "403":
          description: Insufficient role or studio access
  /pulse:
    get:
      operationId: listPulse
      tags: [pulse]
      summary: List Pulse messages visible to the signed-in staff member
      responses:
        "200":
          description: Recent visible messages with read state
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PulseMessage"
        "401":
          description: Sign-in required
        "403":
          description: Fiudia access has not been assigned
    post:
      operationId: createPulseMessage
      tags: [pulse]
      summary: Publish a role- and studio-scoped Pulse message
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PulseInput"
      responses:
        "201":
          description: Pulse message created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PulseMessage"
        "400":
          description: Invalid message details
        "401":
          description: Sign-in required
        "403":
          description: Insufficient role or studio access
  /pulse/{id}/read:
    post:
      operationId: markPulseRead
      tags: [pulse]
      summary: Record that the signed-in staff member read a Pulse message
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Read receipt recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PulseRead"
        "401":
          description: Sign-in required
        "403":
          description: Message is not visible to this staff member
        "404":
          description: Message not found
  /team/invitations:
    get:
      operationId: listInvitations
      tags: [team]
      summary: List invitations available to the signed-in manager
      responses:
        "200":
          description: Pending and recently accepted invitations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Invitation"
        "401":
          description: Sign-in required
        "403":
          description: Insufficient role
    post:
      operationId: createInvitation
      tags: [team]
      summary: Invite a colleague with a manager-assigned role
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvitationInput"
      responses:
        "201":
          description: Invitation created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invitation"
        "400":
          description: Invalid invitation details
        "401":
          description: Sign-in required
        "403":
          description: Insufficient role or studio access
  /team/invitations/{token}/accept:
    post:
      operationId: acceptInvitation
      tags: [team]
      summary: Accept a role invitation for the signed-in account
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Invitation accepted and role assigned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          description: Sign-in required
        "403":
          description: Invitation does not match the signed-in account
        "404":
          description: Invitation not found or expired
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Role:
      type: string
      enum: [district_manager, studio_manager, studio_employee]
    MemberStatus:
      type: string
      enum: [active, trial, paused]
    Me:
      type: object
      required: [userId, userName, email, isOnboarded]
      properties:
        userId: { type: string }
        userName: { type: string }
        email: { type: string, format: email }
        isOnboarded: { type: boolean }
        role: { allOf: [{ $ref: "#/components/schemas/Role" }], nullable: true }
        organizationId: { type: ["integer", "null"] }
        organizationName: { type: ["string", "null"] }
        studioId: { type: ["integer", "null"] }
        studioName: { type: ["string", "null"] }
    OnboardingInput:
      type: object
      required: [organizationName, studioName, city]
      properties:
        organizationName: { type: string, minLength: 2, maxLength: 120 }
        studioName: { type: string, minLength: 2, maxLength: 120 }
        city: { type: string, minLength: 2, maxLength: 120 }
    StudioSummary:
      type: object
      required: [id, name, city]
      properties:
        id: { type: integer }
        name: { type: string }
        city: { type: string }
    DashboardMetric:
      type: object
      required: [label, value, delta, tone]
      properties:
        label: { type: string }
        value: { type: string }
        delta: { type: string }
        tone: { type: string, enum: [positive, neutral, warning] }
    DashboardActivity:
      type: object
      required: [id, title, description, happenedAt, category]
      properties:
        id: { type: integer }
        title: { type: string }
        description: { type: string }
        happenedAt: { type: string, format: date-time }
        category: { type: string, enum: [member, course, team, check_in] }
    Dashboard:
      type: object
      required: [role, userName, studioName, metrics, activities, courses]
      properties:
        role: { $ref: "#/components/schemas/Role" }
        userName: { type: string }
        studioName: { type: string }
        metrics:
          type: array
          items: { $ref: "#/components/schemas/DashboardMetric" }
        activities:
          type: array
          items: { $ref: "#/components/schemas/DashboardActivity" }
        courses:
          type: array
          items: { $ref: "#/components/schemas/Course" }
    Member:
      type: object
      required: [id, fullName, email, phone, membershipType, status, studioId, studioName, joinedAt, lastCheckIn]
      properties:
        id: { type: integer }
        fullName: { type: string }
        email: { type: ["string", "null"], format: email }
        phone: { type: ["string", "null"] }
        membershipType: { type: string }
        status: { $ref: "#/components/schemas/MemberStatus" }
        studioId: { type: integer }
        studioName: { type: string }
        joinedAt: { type: string, format: date-time }
        lastCheckIn: { type: ["string", "null"], format: date-time }
    MemberInput:
      type: object
      required: [fullName, email, membershipType, studioId]
      properties:
        fullName: { type: string, minLength: 2, maxLength: 160 }
        email: { type: string, format: email, maxLength: 320 }
        phone: { type: string, maxLength: 40 }
        membershipType: { type: string, minLength: 2, maxLength: 80 }
        status: { $ref: "#/components/schemas/MemberStatus" }
        studioId: { type: integer }
    MemberUpdate:
      type: object
      properties:
        fullName: { type: string, minLength: 2, maxLength: 160 }
        email: { type: string, format: email, maxLength: 320 }
        phone: { type: ["string", "null"], maxLength: 40 }
        membershipType: { type: string, minLength: 2, maxLength: 80 }
        status: { $ref: "#/components/schemas/MemberStatus" }
    Course:
      type: object
      required: [id, title, instructor, studioId, studioName, startsAt, endsAt, capacity, enrolled, room, status]
      properties:
        id: { type: integer }
        title: { type: string }
        instructor: { type: string }
        studioId: { type: integer }
        studioName: { type: string }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        capacity: { type: integer }
        enrolled: { type: integer }
        room: { type: string }
        status: { type: string, enum: [scheduled, full, cancelled] }
    CourseInput:
      type: object
      required: [title, instructor, studioId, startsAt, endsAt, capacity, room]
      properties:
        title: { type: string, minLength: 2, maxLength: 120 }
        instructor: { type: string, minLength: 2, maxLength: 120 }
        studioId: { type: integer }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        capacity: { type: integer, minimum: 1, maximum: 200 }
        room: { type: string, minLength: 1, maxLength: 80 }
    StaffBookingInput:
      type: object
      required: [memberId]
      properties:
        memberId: { type: integer }
    BookingCancellationInput:
      type: object
      required: [expectedStatus]
      properties:
        expectedStatus: { type: string, enum: [confirmed, waitlisted] }
    CourseBooking:
      type: object
      required: [id, courseId, memberId, status, waitlistPosition]
      properties:
        id: { type: integer }
        courseId: { type: integer }
        memberId: { type: integer }
        status: { type: string, enum: [confirmed, waitlisted, cancelled] }
        waitlistPosition: { type: ["integer", "null"] }
    CourseRosterBooking:
      type: object
      required: [id, courseId, memberId, memberName, status, waitlistPosition, createdAt]
      properties:
        id: { type: integer }
        courseId: { type: integer }
        memberId: { type: integer }
        memberName: { type: string }
        status: { type: string, enum: [confirmed, waitlisted] }
        waitlistPosition: { type: ["integer", "null"] }
        createdAt: { type: string, format: date-time }
    MemberInvitationLink:
      type: object
      required: [inviteUrl, expiresAt, memberName, memberEmail]
      properties:
        inviteUrl: { type: string }
        expiresAt: { type: string, format: date-time }
        memberName: { type: string }
        memberEmail: { type: string, format: email }
    MemberInvitationAcceptInput:
      type: object
      required: [token]
      properties:
        token: { type: string, minLength: 32, maxLength: 128 }
    MemberNotification:
      type: object
      required: [id, courseId, title, body, createdAt, readAt]
      properties:
        id: { type: integer }
        courseId: { type: integer }
        title: { type: string }
        body: { type: string }
        createdAt: { type: string, format: date-time }
        readAt: { type: ["string", "null"], format: date-time }
    ModuleKey:
      type: string
      enum: [members, courses, pulse, team]
    ModuleSetting:
      type: object
      required: [key, title, enabled]
      properties:
        key: { $ref: "#/components/schemas/ModuleKey" }
        title: { type: string }
        enabled: { type: boolean }
    ModuleUpdate:
      type: object
      required: [enabled]
      properties:
        enabled: { type: boolean }
    MemberLinkInput:
      type: object
      required: [memberId]
      properties:
        memberId: { type: integer }
    MemberHome:
      type: object
      required: [member, checkInCount, nextCourse, upcomingBookings, coursesEnabled, checkInsEnabled]
      properties:
        member:
          oneOf:
            - { $ref: "#/components/schemas/Member" }
            - { type: "null" }
        checkInCount: { type: integer }
        coursesEnabled: { type: boolean }
        checkInsEnabled: { type: boolean }
        nextCourse:
          oneOf:
            - { $ref: "#/components/schemas/MemberCourse" }
            - { type: "null" }
        upcomingBookings: { type: integer }
    MemberCourse:
      type: object
      required: [id, title, instructor, studioName, startsAt, endsAt, capacity, enrolled, room, bookingStatus, waitlistPosition]
      properties:
        id: { type: integer }
        title: { type: string }
        instructor: { type: string }
        studioName: { type: string }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
